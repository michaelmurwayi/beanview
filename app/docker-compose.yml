version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: huncho
      MYSQL_DATABASE: beanview
      MYSQL_USER: huncho
      MYSQL_PASSWORD: C11h28no3
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: app.settings
      DATABASE_HOST: cebba_db
      DATABASE_PORT: 3306
      DATABASE_NAME: beanview
      DATABASE_USER: huncho
      DATABASE_PASSWORD: C11h28no3
      PYTHONUNBUFFERED: 1
    volumes:
      - .:/app
    command: ["/entrypoint.sh"]

volumes:
  db_data:
