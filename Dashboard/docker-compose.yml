version: "3.8"
services:
  # Dev service: mounts code, runs vite for hot reload (port 5173)
  dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    # use this for local development: docker-compose up dev

  # Prod service: uses the Dockerfile (builds and serves via nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    # docker-compose up --build web
